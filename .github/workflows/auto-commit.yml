name: Daily Auto Commit

on:
  schedule:
    # Runs every day at 10:30 AM IST (05:00 UTC)
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Git identity
        run: |
          git config --global user.name "AryanSharma-hash"
          git config --global user.email "amangametester@gmail.com"

      - name: Modify a file and commit
        run: |
          date >> activity.txt
          git add activity.txt
          git commit -m "Automated daily activity update"
          git push
